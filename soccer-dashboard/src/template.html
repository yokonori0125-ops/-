<title>Match Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: sticky tab bar → one scrolling column (max 1200px) of cards; scoreboard hero on match pages */
:root {
  --bg: #f3f5f3; --surface: #fcfdfc; --surface-2: #eaeeea; --line: #d9dfda; --grid: #e6eae6;
  --fg: #0f1411; --fg-2: #48514b; --muted: #6e7771;
  --own: #2a78d6; --opp: #eb6834;
  --k1: #1baf7a; --k2: #6250d6; --k3: #eda100; --k4: #e87ba4;
  --z1: #86b6ef; --z2: #2a78d6; --z3: #104281;
  --win: #0a8a0a; --draw: #6e7771; --loss: #c43434;
  --pos: #2a78d6; --neg: #e34948;
  --nav: #0f2219; --nav-fg: #e8efe9; --nav-muted: #9db3a5;
  --hl: #6250d6; --bar-strong: #aab2ac; --bar-muted: #d3d9d4;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300;
  --font-display: "Barlow Condensed", "Arial Narrow", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101311; --surface: #181c19; --surface-2: #222723; --line: #2e3530; --grid: #262c28;
    --fg: #edf1ee; --fg-2: #b6beb8; --muted: #8b948e;
    --own: #3987e5; --opp: #d95926;
    --k1: #199e70; --k2: #9085e9; --k3: #c98500; --k4: #d55181;
    --z1: #256abf; --z2: #5598e7; --z3: #9ec5f4;
    --win: #0ca30c; --draw: #8b948e; --loss: #e66767;
    --pos: #3987e5; --neg: #e66767;
    --nav: #0b1510; --nav-fg: #e8efe9; --nav-muted: #8aa293;
    --hl: #9085e9; --bar-strong: #5f6862; --bar-muted: #3a413c;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101311; --surface: #181c19; --surface-2: #222723; --line: #2e3530; --grid: #262c28;
  --fg: #edf1ee; --fg-2: #b6beb8; --muted: #8b948e;
  --own: #3987e5; --opp: #d95926;
  --k1: #199e70; --k2: #9085e9; --k3: #c98500; --k4: #d55181;
  --z1: #256abf; --z2: #5598e7; --z3: #9ec5f4;
  --win: #0ca30c; --draw: #8b948e; --loss: #e66767;
  --pos: #3987e5; --neg: #e66767;
  --nav: #0b1510; --nav-fg: #e8efe9; --nav-muted: #8aa293;
  --hl: #9085e9; --bar-strong: #5f6862; --bar-muted: #3a413c;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav); }
.num, .tabnum { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--own); outline-offset: 2px; }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--nav); color: var(--nav-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.brand small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--nav-muted); letter-spacing: 0; }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; }
.tabs a { color: var(--nav-muted); text-decoration: none; padding: 16px 12px 14px; font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--nav-fg); }
.tabs a[aria-current="page"] { color: var(--nav-fg); border-bottom-color: var(--nav-fg); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head p { margin: 0; color: var(--muted); font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 360px; }
.chart-box.short { height: 210px; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Hero (overview) */
.hero { display: grid; gap: 24px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: end; }
.hero h1 { font-family: var(--font-display); font-size: clamp(34px, 6vw, 56px); line-height: 1; font-weight: 700; letter-spacing: .01em; }
.hero .meta { color: var(--fg-2); margin-top: 8px; font-size: 13px; }
.record { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.rec { min-width: 74px; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.rec b { display: block; font-family: var(--font-display); font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec span { font-size: 12px; color: var(--muted); }
.rec.w b { color: var(--win); } .rec.l b { color: var(--loss); }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .record { justify-content: flex-start; } }

/* KPI tiles */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lbl { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.kpi .val { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 18px; color: var(--muted); font-weight: 500; }
.kpi .cmp { font-size: 12px; color: var(--muted); }
.kpi svg { width: 100%; height: 34px; margin-top: 6px; display: block; }

/* Insights */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insights li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); white-space: nowrap; margin-top: 1px; }
.tag.good { color: var(--win); border-color: currentColor; }
.tag.bad { color: var(--loss); border-color: currentColor; }

/* Match result cards */
.results { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.res { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; position: relative; transition: border-color .15s, transform .15s; }
.res:hover { border-color: var(--own); transform: translateY(-1px); }
.res .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.res .opp { font-weight: 700; font-size: 14px; line-height: 1.3; }
.res .score { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.res .comp { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: var(--surface); }
.pill.W { background: var(--win); } .pill.D { background: var(--draw); } .pill.L { background: var(--loss); }

/* Head-to-head */
.h2h-legend { display: flex; gap: 16px; font-size: 12px; color: var(--fg-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.h2h { display: grid; gap: 6px; }
.h2h-row { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; }
.h2h-row .v { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--fg-2); }
.h2h-row .v.l { text-align: right; } .h2h-row .v.b { color: var(--fg); font-weight: 700; }
.h2h-mid { display: flex; flex-direction: column; gap: 3px; }
.h2h-mid .name { text-align: center; font-size: 12px; color: var(--fg-2); }
.h2h-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 8px; }
.h2h-bars span { display: block; height: 8px; }
.h2h-bars .a { justify-self: end; background: var(--own); border-radius: 4px 0 0 4px; }
.h2h-bars .b { background: var(--opp); border-radius: 0 4px 4px 0; }

/* Match page */
.switcher { display: flex; gap: 8px; align-items: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex: 1; min-width: 0; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-size: 12px; text-decoration: none; color: var(--fg-2); }
.chip[aria-current="page"] { border-color: var(--fg); color: var(--fg); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.W { background: var(--win); } .dot.D { background: var(--draw); } .dot.L { background: var(--loss); }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; text-decoration: none; color: var(--fg); }
.iconbtn[aria-disabled="true"] { opacity: .35; pointer-events: none; }

.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px 24px; }
.sb-team { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sb-team.r { text-align: right; align-items: flex-end; }
.sb-team .nm { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 3.4vw, 32px); line-height: 1.1; }
.sb-team .fm { font-size: 12px; color: var(--muted); }
.sb-team .side { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
.sb-score { text-align: center; }
.sb-score .s { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 8vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.sb-score .x { font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.sb-meta { grid-column: 1 / -1; display: flex; gap: 8px 18px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 560px) { .scoreboard { grid-template-columns: 1fr 1fr; } .sb-score { grid-column: 1 / -1; order: -1; } }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 14px; border-radius: 99px; cursor: pointer; font-size: 12px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }

.donut { display: flex; flex-direction: column; gap: 10px; }
.donut .chart-box { height: 190px; }
.legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12px; }
.legend-list li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.legend-list .n { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; min-width: 3ch; }
.legend-list .p { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; min-width: 5ch; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
thead th { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; position: sticky; top: 0; background: var(--surface); }
table.kv td { white-space: normal; overflow-wrap: anywhere; }
table.kv td:first-child { white-space: nowrap; width: 5.5em; vertical-align: top; }
td.grp { color: var(--muted); font-size: 12px; }
td.d-pos { color: var(--pos); } td.d-neg { color: var(--neg); }
details.cat { border-top: 1px solid var(--line); }
details.cat:first-of-type { border-top: 0; }
details.cat summary { cursor: pointer; padding: 12px 0; font-weight: 700; display: flex; align-items: center; gap: 8px; list-style: none; }
details.cat summary::-webkit-details-marker { display: none; }
details.cat summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.cat[open] summary::before { transform: rotate(90deg); }
details.cat summary .c { font-weight: 400; color: var(--muted); font-size: 12px; }

/* Heat table */
.heat td.h { position: relative; text-align: center; }
.heat td.h .o { display: block; font-weight: 700; color: var(--fg); }
.heat td.h .dd { display: block; font-size: 11px; color: var(--fg-2); }
.scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); flex-wrap: wrap; }
.scale .bar { width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--neg) 50%, var(--surface)), var(--surface-2), color-mix(in oklab, var(--pos) 50%, var(--surface))); border: 1px solid var(--line); }

/* Trends controls */
.controls { display: flex; gap: 12px 20px; flex-wrap: wrap; align-items: center; }
.controls label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg-2); cursor: pointer; }
select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.mini-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.mini-title span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Import */
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--own); background: color-mix(in oklab, var(--own) 6%, var(--surface)); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--fg); background: var(--fg); color: var(--surface); cursor: pointer; font-weight: 700; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); }
.msg.err { border-color: var(--loss); color: var(--loss); }
.msg.ok { border-color: var(--win); }
.spec { margin: 0; padding-left: 18px; color: var(--fg-2); display: grid; gap: 4px; }
.notes { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 12px; display: grid; gap: 6px; }
/* Factor analysis */
.small { font-size: 12px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); counter-reset: step; }
.flow li { position: relative; padding: 10px 12px 10px 40px; border-radius: 8px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; counter-increment: step; }
.flow li::before { content: counter(step); position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--hl); color: var(--surface); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.flow b { font-size: 13px; } .flow span { font-size: 12px; color: var(--fg-2); }
.team-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 13px; color: var(--fg-2); }
.tchip[aria-pressed="true"] { border-color: var(--hl); color: var(--fg); font-weight: 700; background: color-mix(in oklab, var(--hl) 12%, var(--surface)); }
.tchip[aria-pressed="true"]::before { content: "✓ "; color: var(--hl); }
.legend-inline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg-2); margin-bottom: 8px; }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline .ring { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--bar-strong); }
.legend-inline .dot-f { width: 10px; height: 10px; border-radius: 50%; background: var(--hl); }
.legend-inline .dash { width: 14px; border-top: 1.5px dashed var(--muted); }
.dumbbell { width: 100%; min-width: 480px; height: auto; display: block; }
.dumbbell .svg-tick { font-size: 11px; fill: var(--muted); }
.dumbbell .svg-lbl { font-size: 12px; fill: var(--fg-2); }
.dumbbell .svg-val { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.dumbbell .on { fill: var(--fg); font-weight: 700; }
/* History & comparison */
.banner-wrap { max-width: 1200px; margin: 0 auto; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--hl); background: color-mix(in oklab, var(--hl) 10%, var(--surface)); font-size: 13px; }
.save-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: end; }
@media (max-width: 760px) { .save-form { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.field input { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.danger { color: var(--loss); }
.hist-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.hist-actions a.btn { text-decoration: none; }
.hist-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist-item { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
.hist-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hist-name { font-weight: 700; }
.hist-meta { font-size: 12px; color: var(--fg-2); }
.hist-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hist-btns .btn { padding: 6px 12px; font-size: 12px; }
.tsel[aria-pressed="true"] { border-color: var(--hl); color: var(--fg); background: color-mix(in oklab, var(--hl) 12%, var(--surface)); }
.tchip.cmp { display: inline-flex; align-items: center; gap: 6px; }
.tchip.cmp[aria-pressed="true"]::before { content: none; }
.tchip:disabled { opacity: .45; cursor: not-allowed; }
.lg { display: inline-flex; align-items: center; margin-left: 12px; }
td.best { font-weight: 700; color: var(--fg); }
table.kv-wide td { white-space: normal; min-width: 160px; vertical-align: top; }
.sel-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.sel-tools .btn { padding: 6px 12px; font-size: 12px; }

  starts.forEach((c, i) => {
    const span = (i + 1 < starts.length ? starts[i + 1] : width) - c;
    const head = clean(H[c]);
    if (INFO_SYN[head]) { info[INFO_SYN[head]] = c; return; }
    let parts = head.split(/\s+\/\s+/), base = parts[0], pct = false;
    const m = base.match(/^(.*?)[,、]\s*%$/);
    if (m) { base = m[1]; pct = true; }
    let met = RAW_RENAME[base] || (pct ? `${base}率(%)` : base);
    if (met !== base) renames.add(`${m ? head : base} → ${met}`);
    let subs = parts.slice(1).map(s => (s === '正確' ? '成功' : s));
    let labels;
    if (base === '枠内シュート' && subs.length === 0 && span === 3) labels = ['合計', '枠内', '枠内率(%)'];
    else if (subs.length === 0 && span === 1) labels = [''];
    else {
      const first = /競り合い/.test(met) ? '件数' : '合計';
      if (span === subs.length + 1) labels = [first, ...subs];
      else if (span === subs.length + 2) labels = [first, ...subs, rateLabel(subs.at(-1) || '')];
      else labels = Array.from({ length: span }, (_, k) => (k === 0 ? first : subs.at(k - 1) || `列${k + 1}`));
    }
    labels.forEach((sub, k) => cols.push({ idx: c + k, met, sub }));
  });
  if (!('チーム' in info) || !cols.length) return null;
  const label = clean((aoa[hr + 1] || [])[0]);
  const rows = [];
  let last = {};
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const first = clean(row[0]);
    if (/^平均|^注記|^【/.test(first)) break;
    const team = clean(row[info['チーム']]);
    if (!team) { if (row.every(v => !clean(v))) { if (rows.length) break; } continue; }
    const g = n => (n in info ? row[info[n]] : null);
    for (const n of ['日付', '試合', '大会', '試合時間(分)']) { const v = g(n); if (clean(v)) last[n] = v; }
    rows.push({ date: toISODate(last['日付']), match: clean(last['試合']), comp: clean(last['大会']), dur: last['試合時間(分)'] ?? null,
      team, side: clean(g('区分')), form: clean(g('フォーメーション')), vals: Object.fromEntries(cols.map(c => [K(c.met, c.sub), numOrNull(row[c.idx])])) });
  }

  return { kind: 'raw', file, cols: cols.map(({ met, sub }) => ({ met, sub })), rows, ownLabel: label !== '対戦相手' ? label : '', renames: [...renames] };
}

// 整理済み（4 段見出し）シートも同じ形に変換する
function meceSheetAsSource(aoa, file) {
  const d = parseSheet(aoa);
  const rows = d.matches.flatMap(m => [m.own, m.opp].map(s => ({ date: s.date, match: s.name, comp: s.comp, dur: s.dur, team: s.team,
    side: s === m.own ? '自チーム' : '対戦相手', form: s.form, vals: s.vals })));
  return { kind: 'mece', file, aoa, data: d, cols: d.metrics.filter(c => !c.kpi).map(c => ({ met: c.met, sub: c.sub, cat: c.cat, grp: c.grp })), rows, ownLabel: d.ownTeam, renames: [] };
}

function sourceFromSheet(aoa, file) {
  const hr = aoa.findIndex(r => r && clean(r[0]) === '日付');
  if (hr < 0) return null;

  return parseRawSheet(aoa, file);
}

function classify(met, srcCat, srcGrp) {
  const i = MECE_SCHEMA.findIndex(s => s[2] === met);
  if (i >= 0) return { cat: MECE_SCHEMA[i][0], grp: MECE_SCHEMA[i][1], order: i, how: 'schema' };
  if (srcCat && MECE_CATS.includes(srcCat)) return { cat: srcCat, grp: srcGrp || `${srcCat.split(' ')[0]}-9 追加指標`, order: 1e3, how: 'source' };
  const h = HEURISTIC.find(([, re]) => re.test(met));
  if (h) { const cat = MECE_CATS.at(h[0] - 1); return { cat, grp: `${h[0]}-9 追加指標`, order: 1e3, how: 'keyword' }; }
  return { cat: MECE_CATS.at(-1), grp: '7-1 未分類', order: 1e4, how: 'none' };
}

// 複数の元シートを、行（日付・試合・チーム）と列（指標・内訳）で突き合わせて 1 枚の整理済みシートにする
function buildMece(sources, fileNames) {
  const rowMap = new Map(), colMap = new Map(), conflicts = [], files = fileNames || [...new Set(sources.map(s => s.file))];
  for (const src of sources) {
    for (const c of src.cols) {
      const k = K(c.met, c.sub);
      if (!colMap.has(k)) colMap.set(k, { met: c.met, sub: c.sub, cat: c.cat, grp: c.grp, files: new Set(), seq: colMap.size });
      colMap.get(k).files.add(src.file);
    }
    for (const r of src.rows) {
      const rk = `${r.date}|${r.match}|${r.team}`;
      if (!rowMap.has(rk)) rowMap.set(rk, { ...r, vals: {} });
      const t = rowMap.get(rk);
      for (const f of ['comp', 'dur', 'side', 'form']) if (t[f] == null || t[f] === '') t[f] = r[f];
      for (const c of src.cols) {
        const k = K(c.met, c.sub), v = r.vals[k];
        if (v == null) continue;
        if (t.vals[k] == null) t.vals[k] = v;
        else if (Math.abs(t.vals[k] - v) > 1e-6) conflicts.push(`${label(c.met, c.sub)}（${r.date} ${r.team}：採用 ${t.vals[k]}、不採用 ${v}［${src.file}］）`);
      }
    }
  }
  const rows = [...rowMap.values()];
  // 算出値（列がなければ追加し、値が空の行は内訳から計算する）
  const derivedAdded = [];
  for (const [met, sub, tMet, tSub, parts] of DERIVED) {
    const k = K(met, sub), need = [K(tMet, tSub), ...parts.map(p => K(p, tSub))];
    if (!need.every(n => colMap.has(n))) continue;
    if (!colMap.has(k)) { colMap.set(k, { met, sub, files: new Set(['算出']), seq: colMap.size }); derivedAdded.push(`${met} / ${sub}`); }
    rows.forEach(r => { if (r.vals[k] == null && need.every(n => r.vals[n] != null)) r.vals[k] = parts.reduce((a, p) => a - r.vals[K(p, tSub)], r.vals[K(tMet, tSub)]); });
  }
  // 自チームの判定：元シートのラベル → 区分列 → 全試合に登場するチーム
  const cnt = {};
  rows.forEach(r => (cnt[r.team] = (cnt[r.team] || 0) + 1));
  const own = sources.map(s => s.ownLabel).find(l => l && cnt[l]) || (rows.find(r => r.side === '自チーム') || {}).team || Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
  rows.forEach(r => (r.side = r.team === own ? '自チーム' : '対戦相手'));
  rows.sort((a, b) => b.date.localeCompare(a.date) || a.match.localeCompare(b.match) || (a.side === '自チーム' ? -1 : 1));
  // 分類と列順（大分類 → 小分類 → 基準の並び → 初出順、同じ指標の内訳は隣り合わせ）
  const metSeq = {};
  for (const c of colMap.values()) metSeq[c.met] = Math.min(metSeq[c.met] ?? Infinity, c.seq);
  const grouped = [...colMap.values()].map(c => {
    const cl = classify(c.met, c.cat, c.grp), sch = MECE_SCHEMA.find(x => x[2] === c.met);
    return { ...c, ...cl, catIdx: MECE_CATS.indexOf(cl.cat), subOrder: sch && sch[3].includes(c.sub) ? sch[3].indexOf(c.sub) : 50 };
  }).sort((a, b) => a.catIdx - b.catIdx || a.grp.localeCompare(b.grp, 'ja') || a.order - b.order || metSeq[a.met] - metSeq[b.met] || a.subOrder - b.subOrder || a.seq - b.seq);
  // 4 段見出しの組み立て
  const W = INFO_ORDER.length + grouped.length, blank = () => Array(W).fill(null);
  const rCat = blank(), rGrp = blank(), rMet = blank(), rSub = blank();
  rCat[0] = '0 試合情報';
  INFO_ORDER.forEach((n, i) => (rGrp[i] = n));
  grouped.forEach((c, j) => {
    const x = INFO_ORDER.length + j, prev = grouped.at(j - 1);
    if (j === 0 || prev.cat !== c.cat) rCat[x] = c.cat;
    if (j === 0 || prev.cat !== c.cat || prev.grp !== c.grp) rGrp[x] = c.grp;
    if (j === 0 || prev.cat !== c.cat || prev.grp !== c.grp || prev.met !== c.met) rMet[x] = c.met;
    rSub[x] = c.sub || null;
  });
  const body = rows.map(r => [r.date, r.match, r.comp, r.dur, r.team, r.side, r.form, ...grouped.map(c => r.vals[K(c.met, c.sub)] ?? null)]);
  // 整合チェック（失点＝相手のゴール など）
  const mirror = [];
  for (const [a, as, b, bs] of [['失点', '', 'ゴール', ''], ['被シュート', '合計', 'シュート', '合計'], ['被シュート', '枠内', 'シュート', '枠内']]) {
    if (!colMap.has(K(a, as)) || !colMap.has(K(b, bs))) continue;
    for (const r of rows) {
      const o = rows.find(x => x.date === r.date && x.match === r.match && x !== r);
      if (o && r.vals[K(a, as)] != null && o.vals[K(b, bs)] != null && r.vals[K(a, as)] !== o.vals[K(b, bs)]) mirror.push(`${r.date} ${r.team}：${label(a, as)} ${r.vals[K(a, as)]} ≠ 相手の${label(b, bs)} ${o.vals[K(b, bs)]}`);
    }
  }
  const dups = [...colMap.values()].filter(c => c.files.size > 1).map(c => label(c.met, c.sub));
  const byHow = how => grouped.filter(c => c.how === how).map(c => label(c.met, c.sub));
  const metCount = new Set(grouped.map(c => c.met)).size;
  const notes = [
    `【自動整理】${files.length}ファイル（${files.join('、')}）を、日付・試合・チームで突き合わせて1シートに統合。${rows.length / 2}試合、指標 ${metCount}個（${grouped.length}列）を${new Set(grouped.map(c => c.cat)).size}つの大分類に整理。`,
    `【MECE構造】大分類は「${MECE_CATS.join(' / ')}」。各列はいずれか1つの分類にのみ属する。ファイルをまたいで計算するKPIは、元の指標と二重に数えないよう「${KPI_CAT}」として別に表示する。`,
    dups.length && `【重複の統合】複数ファイルにある同じ指標を1列に統合：${dups.join('、')}。${conflicts.length ? '' : '全行で値が一致。'}`,
    conflicts.length && `【値の不一致】${conflicts.length}件。優先するファイル（追加読み込みでは新しいファイル、同時に読み込んだ場合は先頭のファイル）の値を採用：${conflicts.slice(0, 8).join('、')}${conflicts.length > 8 ? ' ほか' : ''}。`,
    [...new Set(sources.flatMap(s => s.renames))].length && `【名称の補正】${[...new Set(sources.flatMap(s => s.renames))].join('、')}。`,
    derivedAdded.length && `【算出値】内訳の網羅性を確保するため追加：${derivedAdded.join('、')}（総数 − 内訳の和）。`,
    byHow('keyword').length && `【キーワードで分類】基準にない指標を名前から振り分け：${byHow('keyword').join('、')}。`,
    byHow('none').length && `【未分類】分類できなかった指標：${byHow('none').join('、')}。`,
    mirror.length && `【元データの不整合】${mirror.slice(0, 6).join('、')}${mirror.length > 6 ? ' ほか' : ''}。補正せず元データのまま掲載。`,
  ].filter(Boolean);
  const aoa = [[`${own} チームスタッツ（${rows.length / 2}試合）— 自動MECE整理`], [], rCat, rGrp, rMet, rSub, ...body, [], ['注記'], ...notes.map(n => [n])];
  return { aoa, summary: { files: files.length, matches: rows.length / 2, metrics: metCount, columns: grouped.length, dups: dups.length, conflicts: conflicts.length, unclassified: byHow('none').length } };
}

/* ============ Stats helpers ============ */
const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sd = a => { const v = a.filter(x => x != null), m = mean(v); return v.length > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1)) : 0; };
const pearson = (xs, ys) => {
  const p = xs.map((x, i) => [x, ys[i]]).filter(q => q[1] != null);
  if (p.length < 4) return 0;
  const mx = mean(p.map(q => q[0])), my = mean(p.map(q => q[1]));
  let n = 0, dx = 0, dy = 0;
  for (const [x, y] of p) { n += (x - mx) * (y - my); dx += (x - mx) ** 2; dy += (y - my) ** 2; }
  return dx && dy ? n / Math.sqrt(dx * dy) : 0;
};
const isPct = (met, sub) => /%|率/.test(sub || '') || /%/.test(met);
const label = (met, sub) => {
  const m = met.replace(/\(%\)/, '');
  if (!sub || sub === '合計' || sub === '件数') return m;
  return `${m} ${sub.replace(/\(%\)/, '')}`;
};
const fmt = (v, met, sub, digits) => {
  if (v == null || isNaN(v)) return '–';
  if (isPct(met, sub)) return v.toFixed(1) + '%';
  if (/xG/.test(met)) return v.toFixed(2);
  if (digits != null) return v.toFixed(digits);
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
};
const fmtDiff = (d, met, sub) => {
  if (d == null || isNaN(d)) return '–';
  const s = d > 0 ? '+' : d < 0 ? '−' : '±';
  const a = Math.abs(d);
  if (isPct(met, sub)) return s + a.toFixed(1) + 'pt';
  if (/xG/.test(met)) return s + a.toFixed(2);
  return s + (Number.isInteger(a) ? a : a.toFixed(1));
};
const shortDate = d => { const p = d.split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}` : d; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RES = { W: '勝', D: '分', L: '敗' };
const get = (side, met, sub) => (side && side.vals[K(met, sub)] != null ? side.vals[K(met, sub)] : null);

/* 主要指標（polarity: 1 = 高いほど良い, -1 = 低いほど良い） */
const KEY_METRICS = [
  ['xG', '', 'xG', 1], ['シュート', '合計', 'シュート', 1], ['シュート', '枠内', '枠内シュート', 1],
  ['ボール保持率(%)', '', 'ボール保持率', 1], ['パス', '合計', 'パス数', 1], ['パス', '成功率(%)', 'パス成功率', 1],
  ['1/3へのパス', '成功', '1/3へのパス（成功）', 1], ['クロス', '合計', 'クロス', 1],
  ['ポジショナルアタック', 'シュートあり', 'ポジショナル攻撃→シュート', 1], ['カウンターアタック', '合計', 'カウンター攻撃', 1],
  ['リカバリー（ゾーン別）', '合計', 'リカバリー', 1], ['リカバリー（ゾーン別）', '高', 'リカバリー（高）', 1],

/* ============ State ============ */
const S = { data: null, pieSide: 'own', trendKey: K('xG'), showOpp: true, showAvg: true, source: 'sample', fileName: '', strong: new Set(), ana: null, excluded: new Set(), fullAoa: null, allMatches: null };
function loadData(d, source, fileName, aoa, files) {

// 試合の選択：統合した元シート（S.fullAoa）は残し、反映する試合だけのシートを作って全タブで使う
const matchKey = (date, name) => `${date}|${name}`;
function filterAoa(aoa, excluded) {
  if (!excluded || !excluded.size) return aoa;
  const hr = aoa.findIndex(r => r && clean(r[0]) === '日付');
  const g = aoa[hr] || [], iD = g.findIndex(v => clean(v) === '日付'), iM = g.findIndex(v => clean(v) === '試合');
  const out = [], dropped = new Map();
  let inData = false;
  aoa.forEach((r, i) => {
    if (i <= hr + 2) { out.push(r); if (i === hr + 2) inData = true; return; }
    const first = clean((r || [])[0]);
    if (inData && first && !/^平均|^注記|^【/.test(first)) {
      const k = matchKey(toISODate(r[iD]), clean(r[iM]));
      if (excluded.has(k)) { dropped.set(k, `${toISODate(r[iD])} ${clean(r[iM])}`); return; }

function setDataset(fullAoa, o = {}) {

  if (S.excluded.size >= keys.size) S.excluded = new Set();
  const view = filterAoa(fullAoa, S.excluded);
  loadData(S.excluded.size ? parseSheet(view) : full, o.source, o.fileName, view, o.files);
  S.strong = new Set(o.strong || full.matches.flatMap(m => [m.own.team, m.opp.team]).filter(t => STRONG_DEFAULT.includes(t)));

function bindSelection() {

  const setEx = ex => {
    if (ex.size >= all.length) { toast('少なくとも1試合を選んでください'); renderImport(); return; }
    S.excluded = ex; applySelection(); persistSelection(); renderImport();
  };
  app.querySelectorAll('.sel-table input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    const ex = new Set(S.excluded); cb.checked ? ex.delete(cb.dataset.key) : ex.add(cb.dataset.key); setEx(ex);
  }));
  const allBtn = app.querySelector('[data-sel-all]'); if (allBtn) allBtn.addEventListener('click', () => setEx(new Set()));
  app.querySelectorAll('[data-sel-comp]').forEach(b => b.addEventListener('click', () => { const c = comps.at(+b.dataset.selComp); setEx(new Set(all.filter(m => m.comp !== c).map(m => matchKey(m.date, m.name)))); }));
  app.querySelectorAll('[data-sel-recent]').forEach(b => b.addEventListener('click', () => setEx(new Set(all.slice(+b.dataset.selRecent).map(m => matchKey(m.date, m.name))))));
}

/* ============ Theme / charts ============ */
const T = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const charts = [];
const mk = (el, cfg) => { const c = new Chart(el, cfg); charts.push(c); return c; };

const crosshair = { id: 'crosshair', afterDatasetsDraw(chart) {
  const a = chart.tooltip && chart.tooltip.getActiveElements(); if (!a || !a.length) return;
  const x = a[0].element.x, { top, bottom } = chart.chartArea, ctx = chart.ctx;
  ctx.save(); ctx.strokeStyle = T('muted'); ctx.globalAlpha = .45; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore(); } };
const centerText = { id: 'centerText', afterDraw(chart, _a, o) {
  if (!o || !o.text) return; const { ctx, chartArea: { left, right, top, bottom } } = chart;
  const cx = (left + right) / 2, cy = (top + bottom) / 2;

  if (o.sub) { ctx.fillStyle = T('muted'); ctx.font = `500 11px ${T('font-body')}`; ctx.fillText(o.sub, cx, cy + 13); }
  ctx.restore(); } };
Chart.register(centerText);

/* ============ Components ============ */
function sparkSVG(vals, color) {
  const v = vals.map(x => (x == null ? null : x)), ok = v.filter(x => x != null);
  if (ok.length < 2) return '';
  const W = 160, H = 34, pad = 4, mn = Math.min(...ok), mx = Math.max(...ok), rng = mx - mn || 1;
  const pts = v.map((y, i) => y == null ? null : [pad + i * (W - 2 * pad) / (v.length - 1), H - pad - (y - mn) / rng * (H - 2 * pad)]).filter(Boolean);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const area = `${d} L${last[0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="${color}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
}

function h2hHTML(a, b, nameA, nameB) {
  const rows = keyMetrics().map(([met, sub, lbl, pol]) => {
    const x = get(a, met, sub), y = get(b, met, sub);
    const mx = Math.max(x || 0, y || 0) || 1;
    const better = x == null || y == null || x === y ? 0 : (x > y ? 1 : -1) * pol;
    return `<div class="h2h-row" role="row">
      <div class="v l ${better > 0 ? 'b' : ''}" role="cell">${fmt(x, met, sub, met === 'xG' ? 2 : undefined)}</div>
      <div class="h2h-mid" role="cell"><div class="name">${esc(lbl)}</div>
        <div class="h2h-bars"><span class="a" style="width:${(x || 0) / mx * 100}%"></span><span class="b" style="width:${(y || 0) / mx * 100}%"></span></div></div>
      <div class="v ${better < 0 ? 'b' : ''}" role="cell">${fmt(y, met, sub, met === 'xG' ? 2 : undefined)}</div></div>`;
  }).join('');
  return `<div class="h2h-legend"><span><i class="sw" style="background:var(--own)"></i>${esc(nameA)}</span><span><i class="sw" style="background:var(--opp)"></i>${esc(nameB)}</span><span class="muted">太字＝優位</span></div>
    <div class="h2h" role="table" style="margin-top:12px">${rows}</div>`;
}

function avgSide(which) {
  const vals = {};
  for (const c of S.data.metrics) vals[c.key] = mean(S.data.matches.map(m => m[which].vals[c.key]));
  return { vals };
}

/* ============ Auto analysis ============ */
function matchInsights(m) {
  const out = [], ms = S.data.matches;
  const xf = get(m.own, 'xG'), xa = get(m.opp, 'xG');
  if (xf != null && xa != null) {
    const gd = m.gf - m.ga, xd = xf - xa;
    const agree = (gd > 0 && xd > 0) || (gd < 0 && xd < 0) || (gd === 0 && Math.abs(xd) < .5);
    out.push([agree ? '' : 'bad', '結果とxG', `${RES[m.result]}（${m.gf}-${m.ga}）。xGは ${xf.toFixed(2)} 対 ${xa.toFixed(2)}（差 ${fmtDiff(xd, 'xG')}）。${agree ? 'スコアはxG差と同じ方向。' : 'スコアとxG差の方向が一致しない。'}`]);
    const ov = m.gf - xf, ova = m.ga - xa;
    out.push([ov >= 0 ? 'good' : 'bad', '決定力', `得点 − xG = ${fmtDiff(ov, 'xG')}、失点 − 被xG = ${fmtDiff(ova, 'xG')}。`]);
  }
  // 自チーム平均からの乖離（標準化）
  if (ms.length >= 3) {
    const cand = [];
    for (const c of S.data.metrics) {
      if (c.derived || !['', '合計', '件数', '成功率(%)', '勝率(%)', '枠内率(%)'].includes(c.sub) || /^(失点|被シュート)/.test(c.met)) continue;
      const series = ms.map(x => x.own.vals[c.key]), s = sd(series), mu = mean(series), v = m.own.vals[c.key];
      if (!s || v == null || mu == null) continue;
      // 母数が小さい指標（PK・警告など）はノイズになるため除外
      const base = isPct(c.met, c.sub) ? mean(ms.map(x => x.own.vals[K(c.met, '合計')] ?? x.own.vals[K(c.met, '件数')] ?? null)) : mu;
      if (base == null || Math.abs(base) < 3) continue;
      const z = (v - mu) / s;
      const rank = series.filter(x => x != null && x > v).length;
      const ext = rank === 0 ? '（全試合で最多/最高）' : series.filter(x => x != null && x < v).length === 0 ? '（全試合で最少/最低）' : '';
      cand.push({ c, z, v, mu, ext });
    }
    cand.sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
    cand.slice(0, 3).forEach(({ c, z, v, mu, ext }) =>
      out.push(['', '平均との差', `${label(c.met, c.sub)} ${fmt(v, c.met, c.sub)} は自チーム平均 ${fmt(mu, c.met, c.sub, 1)} に対し ${fmtDiff(v - mu, c.met, c.sub)}（${z >= 0 ? '+' : '−'}${Math.abs(z).toFixed(1)}σ）${ext}`]));
  }
  // 対戦相手との差
  const rel = keyMetrics().map(([met, sub, lbl, pol]) => {
    const x = get(m.own, met, sub), y = get(m.opp, met, sub);
    if (x == null || y == null || (!x && !y)) return null;
    return { lbl, met, sub, x, y, r: pol * (x - y) / Math.max(Math.abs(x), Math.abs(y)) };
  }).filter(Boolean).sort((a, b) => b.r - a.r);
  if (rel.length) {
    const t = rel[0], w = rel[rel.length - 1];
    if (t.r > 0) out.push(['good', '最大の優位', `${t.lbl}：${fmt(t.x, t.met, t.sub)} 対 ${fmt(t.y, t.met, t.sub)}`]);
    if (w.r < 0) out.push(['bad', '最大の劣位', `${w.lbl}：${fmt(w.x, w.met, w.sub)} 対 ${fmt(w.y, w.met, w.sub)}`]);
  }
  return out;
}

function seasonInsights() {
  const ms = S.data.matches, out = [], n = ms.length;
  const W = ms.filter(m => m.result === 'W').length, D = ms.filter(m => m.result === 'D').length, L = n - W - D;
  const gf = ms.reduce((s, m) => s + m.gf, 0), ga = ms.reduce((s, m) => s + m.ga, 0);
  out.push(['', '成績', `${n}試合 ${W}勝${D}分${L}敗、得点 ${gf}・失点 ${ga}（得失点差 ${fmtDiff(gf - ga, '')}）。`]);
  if (has('xG', '')) {
    const xf = ms.reduce((s, m) => s + (get(m.own, 'xG') || 0), 0), xa = ms.reduce((s, m) => s + (get(m.opp, 'xG') || 0), 0);
    out.push([gf - xf >= 0 ? 'good' : 'bad', '得点とxG', `得点合計 ${gf} は xG合計 ${xf.toFixed(2)} に対し ${fmtDiff(gf - xf, 'xG')}。`]);
    out.push([ga - xa <= 0 ? 'good' : 'bad', '失点と被xG', `失点合計 ${ga} は被xG合計 ${xa.toFixed(2)} に対し ${fmtDiff(ga - xa, 'xG')}。`]);
  }
  if (has('ボール保持率(%)', '')) {
    const hi = ms.filter(m => get(m.own, 'ボール保持率(%)') > 50);
    const rec = ms2 => `${ms2.filter(m => m.result === 'W').length}勝${ms2.filter(m => m.result === 'D').length}分${ms2.filter(m => m.result === 'L').length}敗`;
    out.push(['', '保持率と結果', `保持率50%超の試合 ${hi.length}試合（${rec(hi)}）、50%以下 ${n - hi.length}試合（${rec(ms.filter(m => !hi.includes(m)))}）。`]);
  }
  // 時系列トレンド（試合順との相関）
  const idx = ms.map((_, i) => i);
  const tr = keyMetrics().map(([met, sub, lbl, pol]) => {
    const ys = ms.map(m => get(m.own, met, sub)); const r = pearson(idx, ys);
    return { met, sub, lbl, pol, r, first: ys[0], last: ys[ys.length - 1] };
  }).filter(t => Math.abs(t.r) >= .6).sort((a, b) => Math.abs(b.r) - Math.abs(a.r)).slice(0, 3);
  tr.forEach(t => out.push([t.r * t.pol > 0 ? 'good' : 'bad', '推移の傾向',
    `${t.lbl} は試合を追うごとに${t.r > 0 ? '増加' : '減少'}傾向（初戦 ${fmt(t.first, t.met, t.sub)} → 直近 ${fmt(t.last, t.met, t.sub)}、r = ${t.r.toFixed(2)}）。`]));
  return out;
}

function drawDonuts(m) {
  charts.filter(c => c.config.type === 'doughnut').forEach(c => { c.destroy(); charts.splice(charts.indexOf(c), 1); });
  const side = m[S.pieSide], k = ['k1', 'k2', 'k3', 'k4'].map(T), z = ['z1', 'z2', 'z3'].map(T);
  const sideColor = T(S.pieSide === 'own' ? 'own' : 'opp');
  const P = (lbl, met, sub, color) => ({ label: lbl, v: get(side, met, sub), color });
  const defs = [];
  if (has('ボール保持率(%)', '')) defs.push(['d-pos', 'ボール保持率', [{ label: m.own.team, v: get(m.own, 'ボール保持率(%)'), color: T('own') }, { label: m.opp.team, v: get(m.opp, 'ボール保持率(%)'), color: T('opp') }],
    { text: fmt(get(side, 'ボール保持率(%)'), 'ボール保持率(%)'), sub: side.team }, { pct: true }]);
  const st = get(side, 'シュート', '合計'), on = get(side, 'シュート', '枠内');
  if (st != null) defs.push(['d-shot', 'シュート 枠内 / 枠外', [{ label: '枠内', v: on, color: sideColor }, { label: '枠外', v: st - on, color: T('muted') }], { text: String(st), sub: 'シュート' }]);
  defs.push(['d-dir', 'パス方向の内訳', [P('前線へ', '前線へのパス', '合計', k[0]), P('横', '横パス', '合計', k[1]), P('バック', 'バックパス', '合計', k[2]), P('方向分類外', '方向分類外（算出値）', '合計', k[3])],
    { text: String(get(side, 'パス', '合計') ?? ''), sub: 'パス総数' }]);
  defs.push(['d-loss', 'ボールロス（ゾーン別）', [P('低', 'ボールロス（ゾーン別）', '低', z[0]), P('中', 'ボールロス（ゾーン別）', '中', z[1]), P('高', 'ボールロス（ゾーン別）', '高', z[2])],
    { text: String(get(side, 'ボールロス（ゾーン別）', '合計') ?? ''), sub: 'ロス合計' }]);
  defs.push(['d-rec', 'リカバリー（ゾーン別）', [P('低', 'リカバリー（ゾーン別）', '低', z[0]), P('中', 'リカバリー（ゾーン別）', '中', z[1]), P('高', 'リカバリー（ゾーン別）', '高', z[2])],
    { text: String(get(side, 'リカバリー（ゾーン別）', '合計') ?? ''), sub: 'リカバリー合計' }]);
  defs.push(['d-duel', '競り合いの種類（件数）', [P('攻め', '攻め競り合い', '件数', k[0]), P('守り', '守り競り合い', '件数', k[1]), P('空中', '空中競り合い', '件数', k[2]), P('その他', 'その他（算出値）', '件数', k[3])],
    { text: String(get(side, '競り合い（全体）', '件数') ?? ''), sub: '競り合い総数' }]);
  document.getElementById('donuts').innerHTML = defs.map(([id, t, parts, , o]) => donutCard(id, t, parts, o)).join('');
  defs.forEach(([id, , parts, center]) => drawDonut(id, parts, center));
}

function fullTableHTML(m) {
  const d = S.data;
  return d.catList.map((cat, ci) => {
    const cols = d.metrics.filter(c => c.cat === cat);
    let lastGrp = '';
    const rows = cols.map(c => {
      const x = m.own.vals[c.key], y = m.opp.vals[c.key], avg = mean(d.matches.map(mm => mm.own.vals[c.key]));
      const df = x != null && y != null ? x - y : null;
      const g = c.grp !== lastGrp ? c.grp : ''; lastGrp = c.grp;
      return `<tr><td class="grp">${esc(g)}</td><td class="l">${esc(c.met)}${c.sub ? ` <span class="muted">/ ${esc(c.sub)}</span>` : ''}</td>
        <td>${fmt(x, c.met, c.sub)}</td><td>${fmt(y, c.met, c.sub)}</td><td class="${df > 0 ? 'd-pos' : df < 0 ? 'd-neg' : ''}">${fmtDiff(df, c.met, c.sub)}</td><td class="muted">${fmt(avg, c.met, c.sub, c.met === 'xG' ? 2 : 1)}</td></tr>`;
    }).join('');
    return `<details class="cat" ${ci === 0 ? 'open' : ''}><summary>${esc(cat)} <span class="c">${cols.length}列</span></summary>
      <div class="tbl-wrap"><table><thead><tr><th>小分類</th><th class="l">指標</th><th>${esc(m.own.team)}</th><th>${esc(m.opp.team)}</th><th>差</th><th>平均</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }).join('');
}

const SMALL = [['xG', '', 'xG'], ['ボール保持率(%)', '', 'ボール保持率'], ['パス', '成功率(%)', 'パス成功率'], ['シュート', '合計', 'シュート'], ['競り合い（全体）', '勝率(%)', '競り合い勝率'], ['リカバリー（ゾーン別）', '高', 'リカバリー（高）']];
const HEAT = [['xG', '', 'xG', 1], ['シュート', '合計', 'シュート', 1], ['ボール保持率(%)', '', '保持率', 1], ['パス', '成功率(%)', 'パス成功率', 1], ['1/3へのパス', '成功', '1/3へのパス成功', 1],
  ['競り合い（全体）', '勝率(%)', '競り合い勝率', 1], ['リカバリー（ゾーン別）', '合計', 'リカバリー', 1], ['ボールロス（ゾーン別）', '合計', 'ボールロス', -1], ['ファウル', '', 'ファウル', -1]];

function renderTrends() {
  const d = S.data, ms = d.matches;
  const opts = d.catList.map(cat => `<optgroup label="${esc(cat)}">${d.metrics.filter(c => c.cat === cat).map(c =>
    `<option value="${esc(c.key)}" ${c.key === S.trendKey ? 'selected' : ''}>${esc(c.met)}${c.sub ? ' / ' + esc(c.sub) : ''}</option>`).join('')}</optgroup>`).join('');
  const small = SMALL.filter(([a, b]) => has(a, b));
  const heat = HEAT.filter(([a, b]) => has(a, b));
  app.innerHTML = `
  <section class="card">
    <div class="card-head"><h2>指標の推移</h2><p>全${d.metrics.length}指標から選択・試合日順</p></div>
    <div class="controls">

      <label><input type="checkbox" id="opt-opp" ${S.showOpp ? 'checked' : ''}> 対戦相手を表示</label>
      <label><input type="checkbox" id="opt-avg" ${S.showAvg ? 'checked' : ''}> 自チーム平均線</label>
    </div>
    <div class="chart-box tall" style="margin-top:14px"><canvas id="t-main" role="img" aria-label="選択指標の推移"></canvas></div>
    <div class="tbl-wrap" style="margin-top:12px" id="t-table"></div>
  </section>
  <section><div class="card-head" style="margin-bottom:10px"><h2>主要指標の推移</h2><p><i class="sw" style="background:var(--own)"></i>${esc(d.ownTeam)}　<i class="sw" style="background:var(--opp)"></i>対戦相手</p></div>
    <div class="grid-3">${small.map(([a, b, l], i) => `<div class="card"><div class="mini-title"><h3>${l}</h3><span>平均 ${fmt(mean(ms.map(m => get(m.own, a, b))), a, b, a === 'xG' ? 2 : 1)}</span></div><div class="chart-box short"><canvas id="sm-${i}" role="img" aria-label="${l}の推移"></canvas></div></div>`).join('')}</div></section>
  <section class="card"><div class="card-head"><h2>試合別 優劣マトリクス</h2>
    <div class="scale"><span>相手優位</span><span class="bar"></span><span>自チーム優位</span></div></div>
    <p class="muted" style="margin:-6px 0 12px;font-size:12px">上段＝${esc(d.ownTeam)}の値、下段＝相手との差。ボールロスとファウルは少ない方を優位として着色。</p>
    <div class="tbl-wrap"><table class="heat"><thead><tr><th>試合</th><th>結果</th>${heat.map(h => `<th style="text-align:center">${h[2]}</th>`).join('')}</tr></thead><tbody>
    ${ms.map(m => `<tr><td><a href="#match-${m.no}" style="color:inherit">${shortDate(m.date)} vs ${esc(m.opp.team)}</a></td><td><span class="pill ${m.result}">${RES[m.result]} ${m.gf}-${m.ga}</span></td>
      ${heat.map(([a, b, , pol]) => { const x = get(m.own, a, b), y = get(m.opp, a, b); const r = x == null || y == null || (!x && !y) ? 0 : pol * (x - y) / Math.max(Math.abs(x), Math.abs(y));
        const pctMix = Math.round(Math.min(1, Math.abs(r) * 1.4) * 45);
        return `<td class="h" style="background:color-mix(in oklab, var(${r >= 0 ? '--pos' : '--neg'}) ${pctMix}%, var(--surface))"><span class="o">${fmt(x, a, b)}</span><span class="dd">${fmtDiff(x - y, a, b)}</span></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></section>`;

  const drawMain = () => {
    charts.filter(c => c.canvas.id === 't-main').forEach(c => { c.destroy(); charts.splice(charts.indexOf(c), 1); });
    const col = d.metrics.find(c => c.key === S.trendKey) || d.metrics[0];
    const own = ms.map(m => m.own.vals[col.key]), opp = ms.map(m => m.opp.vals[col.key]);
    const ds = [lineDataset(d.ownTeam, own, T('own'))];
    if (S.showOpp) ds.push(lineDataset('対戦相手', opp, T('opp'), { pointStyle: 'rectRot' }));
    lineChart(document.getElementById('t-main'), { datasets: ds, met: col.met, sub: col.sub, avg: S.showAvg ? mean(own) : null });
    document.getElementById('t-table').innerHTML = `<table><thead><tr><th>${esc(label(col.met, col.sub))}</th>${ms.map(m => `<th>${shortDate(m.date)}<br><span style="font-weight:400">${esc(m.opp.team)}</span></th>`).join('')}<th>平均</th></tr></thead>

  };
  drawMain();
  document.getElementById('metric').addEventListener('change', e => { S.trendKey = e.target.value; drawMain(); });
  document.getElementById('opt-opp').addEventListener('change', e => { S.showOpp = e.target.checked; drawMain(); });
  document.getElementById('opt-avg').addEventListener('change', e => { S.showAvg = e.target.checked; drawMain(); });
  small.forEach(([a, b, l], i) => lineChart(document.getElementById('sm-' + i), { legend: false, met: a, sub: b,
    datasets: [lineDataset(d.ownTeam, ms.map(m => get(m.own, a, b)), T('own'), { pointRadius: 3 }), lineDataset('対戦相手', ms.map(m => get(m.opp, a, b)), T('opp'), { pointRadius: 3, pointStyle: 'rectRot', borderWidth: 1.5 })] }));
}

async function readFiles(files) {
  renderImport({ type: 'ok', text: `${files.length}ファイルを解析しています…` });
  try {
    const sources = [], skipped = [];
    for (const f of files) {
      const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: 'array', cellDates: true });
      let found = false;
      for (const name of wb.SheetNames) {
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true })
          .map(r => r.map(v => (v instanceof Date ? toISODate(v) : v)));
        const src = sourceFromSheet(aoa, wb.SheetNames.length > 1 ? `${f.name}（${name}）` : f.name);
        if (src) { sources.push(src); found = true; }
      }
      if (!found) skipped.push(f.name);
    }
    if (!sources.length) throw new Error('「日付」と「チーム（グループのデータベース）」の列を持つシートが見つかりません。');
    // 追加モード：これまでのデータも 1 つの元データとして扱い、新しいファイルの値を優先して統合する
    const append = S.importMode === 'append' && S.fullAoa && S.data;
    const prevMatches = append ? S.data.matches.length : 0;
    if (append) sources.push(meceSheetAsSource(S.fullAoa, 'これまでのデータ'));
    const fileNames = [...(append ? S.files : []), ...files.map(f => f.name)];
    // 整理済みシート 1 枚だけを置き換えで読み込む場合はそのまま、それ以外は統合して MECE に整理する
    const single = !append && sources.length === 1 && sources[0].kind === 'mece';
    const built = single ? { aoa: sources[0].aoa, summary: null } : buildMece(sources, fileNames);
    const parsed = parseSheet(built.aoa);
    const name = fileNames.length === 1 ? fileNames[0] : `${fileNames.length}ファイルを統合`;
    const keepEx = append ? [...S.excluded] : [], keepStrong = append ? [...S.strong] : null;
    if (CLOUD) await saveCloud(built.aoa, name, fileNames, keepEx);
    setDataset(built.aoa, { source: CLOUD ? 'cloud' : 'upload', fileName: name, files: fileNames, excluded: keepEx, strong: keepStrong }); updateBrand();
    S.viewing = null; S.prev = null; updateBanner();
    const sm = built.summary, skip = skipped.length ? `（読み込めなかったファイル ${skipped.length}件）` : '';
    toast(append ? `${files.length}ファイルを追加して統合：${prevMatches}試合 → ${parsed.matches.length}試合、指標${sm.metrics}個${skip}`
      : sm ? `${sm.files}ファイルを統合：${sm.matches}試合・指標${sm.metrics}個を整理${skip}`
      : `${files[0].name} から ${parsed.matches.length}試合を読み込みました${CLOUD ? '（クラウドに保存）' : ''}`);
    location.hash = '#overview'; if (location.hash === '#overview') route();
  } catch (e) { renderImport({ type: 'err', text: `読み込めませんでした：${e.message}` }); }
}

function downloadMece() {
  const ws = XLSX.utils.aoa_to_sheet(S.aoa), wb = XLSX.utils.book_new();

/* ============ Factor analysis: correlation / multiple regression ============ */
// 過程指標（得点に至る前段のチーム行動）。シュート・xG は媒介変数なので説明変数に含めない
const PROCESS = [
  ['ボール保持率', 'ボール保持率(%)', ''], ['パス数', 'パス', '合計'], ['パス成功率', 'パス', '成功率(%)'],
  ['前線へのパス成功率', '前線へのパス', '成功率(%)'], ['ロングパス', 'ロングパス', '合計'], ['1/3へのパス成功', '1/3へのパス', '成功'],
  ['縦パス成功', '縦パス', '成功'], ['スマートパス', 'スマートパス', '合計'], ['クロス', 'クロス', '合計'],
  ['ポジショナル攻撃', 'ポジショナルアタック', '合計'], ['カウンター攻撃', 'カウンターアタック', '合計'],
  ['ボールロス', 'ボールロス（ゾーン別）', '合計'], ['ボールロス（低）', 'ボールロス（ゾーン別）', '低'],
  ['リカバリー', 'リカバリー（ゾーン別）', '合計'], ['リカバリー（高）', 'リカバリー（ゾーン別）', '高'],
  ['インターセプト', 'インターセプト', ''], ['クリア', 'クリア', ''], ['競り合い勝率', '競り合い（全体）', '勝率(%)'],
  ['空中戦勝率', '空中競り合い', '勝率(%)'], ['守り競り合い勝率', '守り競り合い', '勝率(%)'], ['ファウル', 'ファウル', ''], ['CK', 'CK', '合計'],
];
const TARGETS = [['xG', 'xG'], ['GF', '得点'], ['xGA', '被xG'], ['GA', '失点']];
const STRONG_DEFAULT = ['Kyoto Sanga', 'Gamba Osaka', 'Kashima Antlers'];
const N_PERM = 1000;

/* --- small linear algebra / distributions --- */
function invert(A) {
  const n = A.length, M = A.map((r, i) => [...r, ...A.map((_, j) => (i === j ? 1 : 0))]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-10) return null;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c];
    for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c]; if (f) for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j]; }
  }
  return M.map(r => r.slice(n));
}
const designX = cols => cols[0].map((_, i) => [1, ...cols.map(c => c[i])]);
const xtx = X => X[0].map((_, a) => X[0].map((_, b) => X.reduce((s, r) => s + r[a] * r[b], 0)));
function ols(cols, y) {
  const X = designX(cols), n = X.length, k = X[0].length, A = invert(xtx(X));
  if (!A) return null;
  const Xty = X[0].map((_, a) => X.reduce((s, r, i) => s + r[a] * y[i], 0));
  const b = A.map(row => row.reduce((s, v, j) => s + v * Xty[j], 0));
  const fit = X.map(r => r.reduce((s, v, j) => s + v * b[j], 0));
  const sse = y.reduce((s, v, i) => s + (v - fit[i]) ** 2, 0), my = mean(y), sst = y.reduce((s, v) => s + (v - my) ** 2, 0);
  const df = n - k, s2 = sse / df;
  const se = b.map((_, j) => Math.sqrt(s2 * A[j][j]));
  const p = b.map((v, j) => (df > 0 && se[j] > 0 ? pT(Math.abs(v / se[j]), df) : NaN));
  const r2 = sst ? 1 - sse / sst : 0;
  return { b, se, p, r2, adj: 1 - (1 - r2) * (n - 1) / df, resid: y.map((v, i) => v - fit[i]) };
}
// 一個抜き交差検証の残差 = R·y（R の各行 = (I − H) の行 / (1 − h_ii)）
function looOperator(cols) {
  const X = designX(cols), A = invert(xtx(X));
  if (!A) return null;
  const AX = X.map(r => A.map(row => row.reduce((s, v, j) => s + v * r[j], 0)));
  const H = X.map((ri, i) => X.map((_, j) => AX[j].reduce((s, v, a) => s + v * ri[a], 0)));
  const R = [];
  for (let i = 0; i < X.length; i++) {
    const d = 1 - H[i][i];
    if (d < 1e-9) return null;
    R.push(H[i].map((h, j) => ((i === j ? 1 : 0) - h) / d));
  }
  return R;
}
const looRmse = (R, y) => Math.sqrt(R.reduce((s, row) => { const e = row.reduce((a, v, j) => a + v * y[j], 0); return s + e * e; }, 0) / y.length);
function lgamma(z) {
  const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let x = z, t = z + 5.5, s = 1.000000000190015;
  t -= (z + 0.5) * Math.log(t);
  for (const c of g) s += c / ++x;
  return -t + Math.log(2.5066282746310005 * s / z);
}
function betacf(a, b, x) {
  let c = 1, d = 1 - (a + b) * x / (a + 1); d = 1 / (Math.abs(d) < 1e-30 ? 1e-30 : d); let h = d;
  for (let m = 1; m <= 200; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((a + m2 - 1) * (a + m2));
    d = 1 + aa * d; d = 1 / (Math.abs(d) < 1e-30 ? 1e-30 : d); c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; h *= d * c;
    aa = -(a + m) * (a + b + m) * x / ((a + m2) * (a + m2 + 1));
    d = 1 + aa * d; d = 1 / (Math.abs(d) < 1e-30 ? 1e-30 : d); c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
    const del = d * c; h *= del;
    if (Math.abs(del - 1) < 3e-12) break;
  }
  return h;
}
function betai(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
const pT = (t, df) => betai(df / 2, 0.5, df / (df + t * t));   // 両側 p 値
function rCrit(n, alpha = .05) {
  const df = n - 2; let lo = 0, hi = 200;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (pT(m, df) > alpha) lo = m; else hi = m; }
  return lo / Math.sqrt(df + lo * lo);
}
const corr = (x, y) => {
  const mx = mean(x), my = mean(y); let n = 0, a = 0, b = 0;
  x.forEach((v, i) => { n += (v - mx) * (y[i] - my); a += (v - mx) ** 2; b += (y[i] - my) ** 2; });
  return a && b ? n / Math.sqrt(a * b) : 0;
};
const residOn = (y, z) => ols([z], y).resid;
function mulberry32(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* --- the analysis itself --- */
function runAnalysis() {
  const key = [...S.strong].sort().join('|') + '#' + S.source + S.fileName + S.data.matches.length;
  if (S.ana && S.ana.key === key) return S.ana;
  const rows = [];
  for (const m of S.data.matches) for (const [a, b] of [[m.own, m.opp], [m.opp, m.own]])
    rows.push({ m, isOwn: a === m.own, team: a.team, side: a,
      GF: get(a, 'ゴール'), GA: get(b, 'ゴール'), xG: get(a, 'xG'), xGA: get(b, 'xG'),
      strength: (S.strong.has(a.team) ? 1 : 0) - (S.strong.has(b.team) ? 1 : 0) });
  const n = rows.length;
  const P = PROCESS.map(([name, met, sub]) => ({ name, met, sub, v: rows.map(r => get(r.side, met, sub)) }))
    .filter(p => p.v.every(v => v != null) && sd(p.v) > 0);
  const Y = {};
  for (const [t] of TARGETS) { const y = rows.map(r => r[t]); if (y.every(v => v != null) && sd(y) > 0) Y[t] = y; }
  const z = rows.map(r => r.strength), hasStrength = sd(z) > 0;
  const critR = rCrit(n), critP = rCrit(n - 1);

  // 1. 相関（補正前・チーム力で補正した偏相関・チーム力との相関）
  const ind = P.map(p => {
    const o = { ...p, raw: {}, partial: {}, rS: hasStrength ? corr(p.v, z) : null };
    const pv = hasStrength ? residOn(p.v, z) : null;
    for (const t in Y) { o.raw[t] = corr(p.v, Y[t]); o.partial[t] = hasStrength ? corr(pv, residOn(Y[t], z)) : null; }
    return o;
  });
  // 2. Jets 単独（n = 試合数）
  const ownIdx = rows.map((r, i) => (r.isOwn ? i : -1)).filter(i => i >= 0);
  const jets = { n: ownIdx.length, crit: ownIdx.length > 3 ? rCrit(ownIdx.length) : 1, r: {} };
  for (const t of ['GA', 'GF']) if (Y[t]) jets.r[t] = P.map(p => ({ name: p.name, r: corr(ownIdx.map(i => p.v[i]), ownIdx.map(i => Y[t][i])) }));
  // 3. 得点 ~ xG
  const gx = Y.GF && Y.xG ? ols([Y.xG], Y.GF) : null;
  // 4. 重回帰（説明変数 1〜2 個の全探索）+ 一個抜き交差検証 + 並べ替え検定
  const combos = [];
  P.forEach((_, i) => combos.push([i]));
  P.forEach((_, i) => P.forEach((_, j) => { if (j > i) combos.push([i, j]); }));
  const rnd = mulberry32(20261028);
  const conds = [];
  for (const [t, tl] of TARGETS) {
    if (!Y[t]) continue;
    for (const adj of hasStrength ? [false, true] : [false]) {
      const ctrl = adj ? [z] : [];
      const ops = combos.map(c => ({ c, R: looOperator([...c.map(i => P[i].v), ...ctrl]) })).filter(o => o.R);
      const R0 = ctrl.length ? looOperator(ctrl) : null;
      const nullOf = y => (R0 ? looRmse(R0, y) : Math.sqrt(y.reduce((s, v, i) => { const m = (y.reduce((a, b) => a + b, 0) - v) / (n - 1); return s + (v - m) ** 2; }, 0) / n));
      const y = Y[t], null0 = nullOf(y);
      if (!ops.length) continue;
      const ranked = ops.map(o => ({ c: o.c, rmse: looRmse(o.R, y) })).sort((a, b) => a.rmse - b.rmse);
      const best = ranked[0], obs = best.rmse / null0;
      let hit = 0;
      for (let k = 0; k < N_PERM; k++) {
        const yp = shuffled(y, rnd), base = nullOf(yp);
        let m = Infinity;
        for (const o of ops) { const v = looRmse(o.R, yp); if (v < m) m = v; }
        if (m / base <= obs) hit++;
      }
      const top = ranked.slice(0, 5).map(r => {
        const cols = [...r.c.map(i => P[i].v), ...ctrl], names = [...r.c.map(i => P[i].name), ...(adj ? ['チーム力'] : [])];
        const f = ols(cols, y), sy = sd(y);
        const vars = names.map((nm, j) => {
          const others = cols.filter((_, q) => q !== j);
          const vif = others.length ? 1 / (1 - ols(others, cols[j]).r2) : 1;
          return { name: nm, b: f.b[j + 1], beta: f.b[j + 1] * sd(cols[j]) / sy, p: f.p[j + 1], vif };
        });
        return { names: r.c.map(i => P[i].name), rmse: r.rmse, gain: 1 - r.rmse / null0, r2: f.r2, adj: f.adj, vars };
      });
      conds.push({ t, tl, adj, null0, top, pPerm: (hit + 1) / (N_PERM + 1), nModels: ops.length });
    }
  }
  const sig = conds.filter(c => c.pPerm < .05);
  const survivors = new Set(sig.flatMap(c => c.top[0].names));
  S.ana = { key, rows, n, P, ind, jets, gx, conds, sig, survivors, hasStrength, critR, critP, nCombos: combos.length };
  return S.ana;
}

function verdictOf(o, A) {
  if (!A.hasStrength || o.partial.xG == null) {
    return Math.abs(o.raw.xG) >= A.critR ? ['候補（未補正）', ''] : ['関係は確認できない', ''];
  }
  const p = o.partial.xG, pa = o.partial.xGA;
  if (p >= A.critP && pa != null && pa >= A.critP) return ['攻め合いの指標', ''];
  if (p >= A.critP && A.survivors.has(o.name)) return ['参考にする（仮説）', 'good'];
  if (p >= A.critP) return ['候補', 'good'];
  if (Math.abs(o.raw.xG) >= A.critR && Math.abs(o.rS) >= .7) return ['チーム力の影響', 'bad'];
  if (p <= -A.critP) return ['負の関係', 'bad'];
  return ['関係は確認できない', ''];
}

function analysisInsights(A) {
  const out = [];
  if (A.gx) out.push(['good', '得点とxG', `xGで得点のばらつきの${Math.round(A.gx.r2 * 100)}%を説明（傾き ${A.gx.b[1].toFixed(2)}、p = ${A.gx.p[1].toFixed(3)}、n = ${A.n}）。`]);
  out.push([A.sig.length ? 'good' : 'bad', '重回帰', `偶然と区別できた最良モデルは ${A.sig.length} / ${A.conds.length} 条件${A.sig.length ? '：' + A.sig.map(c => `${c.tl}${c.adj ? '（チーム力補正）' : ''} ~ ${c.top[0].names.join(' ＋ ')}（p = ${c.pPerm.toFixed(3)}）`).join('、') : ''}。`]);
  if (A.hasStrength) {
    const keep = A.ind.filter(o => o.partial.xG != null && o.partial.xG >= A.critP).map(o => o.name);
    const conf = A.ind.filter(o => Math.abs(o.rS) >= .8).map(o => o.name);
    out.push(['', '補正後も残る', keep.length ? `チーム力を補正してもxGとの相関が有意水準（|r| ≥ ${A.critP.toFixed(2)}）を超える指標：${keep.join('、')}。` : 'チーム力を補正すると、xGと有意な相関を持つ指標はありません。']);
    if (conf.length) out.push(['bad', '交絡', `チーム力とほぼ同じ動きをする指標（|r| ≥ 0.80）：${conf.join('、')}。原因として扱わない。`]);
  } else {
    out.push(['bad', 'チーム力未設定', '上位グループのチームを選ぶと、チーム力で補正した分析が加わります。']);
  }
  const own = A.rows.filter(r => r.isOwn);
  if (own.every(r => r.xGA != null)) {
    const ga = own.reduce((s, r) => s + r.GA, 0), xga = own.reduce((s, r) => s + r.xGA, 0);
    out.push([ga - xga <= 0 ? 'good' : 'bad', '失点と被xG', `${S.data.ownTeam}の失点 ${ga} は被xG ${xga.toFixed(2)} に対し ${fmtDiff(ga - xga, 'xG')}。`]);
  }
  return out;
}

function dumbbellSVG(A, t) {
  const list = A.ind.filter(o => o.raw[t] != null).map(o => ({ name: o.name, raw: o.raw[t], partial: o.partial[t] }))
    .sort((a, b) => (b.partial ?? b.raw) - (a.partial ?? a.raw));
  const W = 640, x0 = 150, x1 = 560, lo = -1, hi = 1, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0), step = 22, y0 = 18;
  const H = y0 + list.length * step + 30, crit = A.hasStrength ? A.critP : A.critR;
  const ticks = [-1, -0.5, 0, 0.5, 1].map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="6" y2="${H - 26}" style="stroke:var(${v === 0 ? '--muted' : '--grid'})"/><text x="${X(v)}" y="${H - 10}" text-anchor="middle" class="svg-tick">${v.toFixed(1)}</text>`).join('');
  const refs = [crit, -crit].map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="6" y2="${H - 26}" style="stroke:var(--muted)" stroke-dasharray="4 4"/>`).join('');
  const rowsSvg = list.map((o, i) => {
    const y = y0 + i * step, end = o.partial ?? o.raw, on = end >= crit;
    const both = o.partial != null;
    return `<g><text x="${x0 - 10}" y="${y + 4}" text-anchor="end" class="svg-lbl${on ? ' on' : ''}">${esc(o.name)}</text>
      ${both ? `<line x1="${X(o.raw)}" x2="${X(o.partial)}" y1="${y}" y2="${y}" style="stroke:var(--bar-muted)" stroke-width="2"/>
      <circle cx="${X(o.raw)}" cy="${y}" r="4.5" style="fill:var(--surface);stroke:var(--bar-strong)" stroke-width="1.5"><title>${esc(o.name)}：補正前 r = ${o.raw.toFixed(2)}</title></circle>` : ''}
      <circle cx="${X(end)}" cy="${y}" r="5" style="fill:var(${on ? '--hl' : '--bar-strong'})"><title>${esc(o.name)}：${both ? '補正後' : ''} r = ${end.toFixed(2)}</title></circle>
      <text x="${W - 4}" y="${y + 4}" text-anchor="end" class="svg-val${on ? ' on' : ''}">${both ? `${o.raw.toFixed(2)} → ${o.partial.toFixed(2)}` : o.raw.toFixed(2)}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="dumbbell" role="img" aria-label="${t}との相関（補正前後）">${ticks}${refs}${rowsSvg}</svg>`;
}

        scales: { x: { min: 0, max: Math.ceil(mx), title: { display: true, text: 'xG' }, grid: { color: T('grid') } }, y: { min: 0, max: Math.ceil(mx), title: { display: true, text: '得点' }, grid: { color: T('grid') }, ticks: { precision: 0 } } } } });

/* ============ Saved analyses (history) and multi-team comparison ============ */
const LOCAL_KEY = 'matchlens.analyses.v1';
const CMP_MAX = 6;
let memStore = null;
function localList() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); }
  catch (e) { S.storeVolatile = true; return memStore || (memStore = []); }
}
function localWrite(list) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); }
  catch (e) { S.storeVolatile = true; memStore = list; }
}
const anaColl = () => firebase.firestore().collection(`users/${cloudUser.uid}/analyses`);
// 保存先：Firebase 版は本人専用の Firestore、単体版はこのブラウザ
const Store = {
  async list() {
    if (!CLOUD) return localList();
    const q = await anaColl().orderBy('createdAt', 'desc').get();
    return q.docs.map(x => { const v = x.data(); return { id: x.id, ...v, createdAt: v.createdAt && v.createdAt.toDate ? v.createdAt.toDate().toISOString() : new Date().toISOString() }; });
  },
  async save(rec) {
    if (CLOUD) return (await anaColl().add({ ...rec, createdAt: firebase.firestore.FieldValue.serverTimestamp() })).id;
    const list = localList(), id = Date.now().toString(36);
    list.unshift({ id, ...rec, createdAt: new Date().toISOString() });
    localWrite(list);
    return id;
  },
  async remove(id) {
    if (CLOUD) return anaColl().doc(id).delete();
    localWrite(localList().filter(r => r.id !== id));
  },
};

function recordOf(d) {
  const ms = d.matches;
  return { n: ms.length, W: ms.filter(m => m.result === 'W').length, D: ms.filter(m => m.result === 'D').length, L: ms.filter(m => m.result === 'L').length,
    GF: ms.reduce((s, m) => s + m.gf, 0), GA: ms.reduce((s, m) => s + m.ga, 0), from: ms[0].date, to: ms.at(-1).date };
}
// 要因分析の要点（保存時に計算して残す）
function analysisDigest() {
  if (S.data.matches.length < 4) return null;
  const A = runAnalysis();
  return { n: A.n, hasStrength: A.hasStrength, strong: [...S.strong], r2: A.gx ? A.gx.r2 : null, conds: A.conds.length,
    sig: A.sig.map(c => ({ target: c.tl, adj: c.adj, model: c.top[0].names.join(' ＋ '), p: c.pPerm })),
    keep: A.hasStrength ? A.ind.filter(o => o.partial.xG != null && o.partial.xG >= A.critP).map(o => o.name) : [],
    conf: A.hasStrength ? A.ind.filter(o => Math.abs(o.rS) >= .8).map(o => o.name) : [] };
}
async function saveCurrent(name, memo) {
  const d = S.data, r = recordOf(d);
  const rec = { name: name || `${d.ownTeam}（${r.from}〜${r.to}）`, memo: memo || '', ownTeam: d.ownTeam, ...r,
    files: S.files || [], aoa: JSON.stringify(S.fullAoa), excluded: [...S.excluded], allN: S.allMatches.length, analysis: analysisDigest() };
  if (rec.aoa.length > 900000) throw new Error('データが大きすぎて保存できません（上限 約900KB）。');
  await Store.save(rec);
  return rec.name;
}
const fmtDate = iso => { const t = new Date(iso); return isNaN(t) ? '' : `${t.getFullYear()}/${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; };

function updateBanner() {
  const b = document.getElementById('banner');
  b.hidden = !S.viewing;
  if (!S.viewing) return;
  b.innerHTML = `<span>過去分析「${esc(S.viewing)}」を表示しています。</span><button type="button" class="btn ghost" id="back-current">${S.prev && S.prev.fullAoa ? '現在のデータに戻る' : '表示を閉じる'}</button>`;
  document.getElementById('back-current').addEventListener('click', backToCurrent);
}
function openSaved(rec) {
  if (!S.viewing) S.prev = { fullAoa: S.fullAoa, excluded: [...(S.excluded || [])], source: S.source, fileName: S.fileName, files: S.files, strong: [...(S.strong || [])] };
  setDataset(JSON.parse(rec.aoa), { source: 'history', fileName: rec.name, files: rec.files, excluded: rec.excluded || [], strong: rec.analysis && rec.analysis.strong });
  S.viewing = rec.name; updateBrand(); updateBanner();
  toast(`「${rec.name}」を開きました`);
  location.hash = '#overview'; if (location.hash === '#overview') route();
}
function backToCurrent() {
  const p = S.prev || {};
  if (p.fullAoa) setDataset(p.fullAoa, { source: p.source, fileName: p.fileName, files: p.files, excluded: p.excluded, strong: p.strong });
  else { S.data = null; S.aoa = null; S.fullAoa = null; S.allMatches = null; S.excluded = new Set(); S.ana = null; }
  S.viewing = null; S.prev = null; updateBrand(); updateBanner(); route();
}
