      <button type="submit" class="btn" id="save-btn">保存</button></form>
      <p class="muted small" style="margin:10px 0 0">保存する内容：${esc(d.ownTeam)}・${r.n}試合${S.excluded.size ? `（全${S.allMatches.length}試合から選択）` : ''}（${r.from}〜${r.to}）・${r.W}勝${r.D}分${r.L}敗、統合したデータ一式、要因分析の要点（チーム力区分：${S.strong.size ? [...S.strong].map(esc).join('、') : 'なし'}）。</p>`
    : '<p class="muted" style="margin:0">保存できるデータがありません。データ取込で Excel を読み込んでください。</p>'}
  </section>
  <section class="card"><div class="card-head"><h2>保存した分析</h2><p>開くと全タブがそのデータで再計算されます</p></div><div id="hist-list"><p class="muted">読み込んでいます…</p></div></section>`;
  const form = document.getElementById('save-form');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('save-btn'); btn.disabled = true; btn.textContent = '保存しています…';
    try { const nm = await saveCurrent(document.getElementById('save-name').value.trim(), document.getElementById('save-memo').value.trim()); renderHistory({ type: 'ok', text: `「${nm}」を保存しました。` }); }
    catch (err) { renderHistory({ type: 'err', text: `保存できませんでした：${err.code === 'permission-denied' ? 'このアカウントには保存する権限がありません。' : err.message}` }); }
  });
  let list;
  try { list = await Store.list(); } catch (err) { document.getElementById('hist-list').innerHTML = `<div class="msg err">一覧を読み込めませんでした（${esc(err.code || err.message)}）。</div>`; return; }
  S.histCache = list;
  S.cmpSel = new Set([...(S.cmpSel || [])].filter(id => id === 'current' || list.some(x => x.id === id)));
  const box = document.getElementById('hist-list');
  if (!box) return;
  if (!list.length) { box.innerHTML = '<p class="muted" style="margin:0">まだ保存した分析はありません。上のフォームから現在の分析を保存できます。</p>'; return; }
  box.innerHTML = `<div class="hist-actions"><span class="muted small">比較に選択中：${S.cmpSel.size}件（最大${CMP_MAX}件）</span><a class="btn ghost" href="#compare">選んだ分析を比較する</a></div>
    <ul class="hist-list">${list.map(x => `<li class="hist-item">
      <div class="hist-main"><div class="hist-name">${esc(x.name)}</div>
        <div class="hist-meta">${esc(x.ownTeam)} · ${x.n}試合${x.allN && x.allN !== x.n ? `（全${x.allN}試合から選択）` : ''}（${esc(x.from)}〜${esc(x.to)}） · <b>${x.W}勝${x.D}分${x.L}敗</b> · 得点${x.GF} 失点${x.GA}</div>
        <div class="hist-meta muted">保存 ${fmtDate(x.createdAt)}${x.files && x.files.length ? ` · ファイル${x.files.length}件` : ''}${x.memo ? ` · ${esc(x.memo)}` : ''}</div></div>
      <div class="hist-btns">
        <button type="button" class="btn ghost" data-open="${esc(x.id)}">開く</button>
        <button type="button" class="btn ghost tsel" data-cmp="${esc(x.id)}" aria-pressed="${S.cmpSel.has(x.id)}">比較に${S.cmpSel.has(x.id) ? '選択中' : '追加'}</button>
        <button type="button" class="btn ghost danger" data-del="${esc(x.id)}">削除</button></div></li>`).join('')}</ul>`;
  box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openSaved(list.find(x => x.id === b.dataset.open))));
  box.querySelectorAll('[data-cmp]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.cmp;
    if (S.cmpSel.has(id)) S.cmpSel.delete(id); else if (S.cmpSel.size < CMP_MAX) S.cmpSel.add(id); else return toast(`比較できるのは最大${CMP_MAX}件です`);
    renderHistory();
  }));
  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'もう一度押すと削除'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = '削除'; } }, 4000); return; }
    try { await Store.remove(b.dataset.del); S.cmpSel.delete(b.dataset.del); renderHistory({ type: 'ok', text: '削除しました。' }); }
    catch (err) { renderHistory({ type: 'err', text: `削除できませんでした（${err.code || err.message}）。` }); }
  }));
}

// 比較する指標（1 試合あたり平均。pol: 1 = 高いほど良い, -1 = 低いほど良い, 0 = スタイル指標）
const CMP_METRICS = [
  ['得点', (s, o) => get(s, 'ゴール'), 1], ['失点', (s, o) => get(o, 'ゴール'), -1], ['xG', (s, o) => get(s, 'xG'), 1], ['被xG', (s, o) => get(o, 'xG'), -1],
  ['xG差', (s, o) => get(s, 'xG差'), 1], ['シュート', (s, o) => get(s, 'シュート', '合計'), 1], ['被シュート', (s, o) => get(o, 'シュート', '合計'), -1],
  ['決定率(%)', (s, o) => get(s, '決定率(%)'), 1], ['シュート1本あたりxG', (s, o) => get(s, 'シュート1本あたりxG'), 1],
  ['ボール保持率(%)', (s, o) => get(s, 'ボール保持率(%)'), 0], ['パス成功率(%)', (s, o) => get(s, 'パス', '成功率(%)'), 1],
  ['1/3へのパス成功', (s, o) => get(s, '1/3へのパス', '成功'), 1], ['リカバリー（高）', (s, o) => get(s, 'リカバリー（ゾーン別）', '高'), 1],
  ['リカバリー（高）比率(%)', (s, o) => get(s, 'リカバリー（高）比率(%)'), 1], ['ボールロス', (s, o) => get(s, 'ボールロス（ゾーン別）', '合計'), -1],
  ['競り合い勝率(%)', (s, o) => get(s, '競り合い（全体）', '勝率(%)'), 1], ['空中戦の割合(%)', (s, o) => get(s, '空中戦の割合(%)'), 0],
  ['セットプレー起点シュート比率(%)', (s, o) => get(s, 'セットプレー起点シュート比率(%)'), 0], ['ファウル', (s, o) => get(s, 'ファウル'), -1],
];
const polLabel = p => (p > 0 ? '高いほど良い' : p < 0 ? '低いほど良い' : 'スタイル指標');
const cmpFmt = (v, name) => (v == null ? '–' : /%/.test(name) ? v.toFixed(1) + '%' : /xG/.test(name) ? v.toFixed(2) : v.toFixed(1));

async function renderCompare() {
  app.innerHTML = '<section class="card"><p class="muted" style="margin:0">読み込んでいます…</p></section>';
  let list = S.histCache;
  try { list = await Store.list(); S.histCache = list; } catch (err) { if (!list) { app.innerHTML = `<div class="msg err">保存した分析を読み込めませんでした（${esc(err.code || err.message)}）。</div>`; return; } }
  S.cmpSel = S.cmpSel || new Set();
  const opts = [...(S.data ? [{ id: 'current', name: `現在のデータ（${S.data.ownTeam}）`, ownTeam: S.data.ownTeam }] : []), ...list];
  const sel = opts.filter(x => S.cmpSel.has(x.id));
  const chips = opts.map(x => { const i = sel.indexOf(x); return `<button type="button" class="tchip cmp" data-id="${esc(x.id)}" aria-pressed="${i >= 0}" ${i < 0 && sel.length >= CMP_MAX ? 'disabled' : ''}>${i >= 0 ? `<i class="sw" style="background:var(--c${i + 1})"></i>` : ''}${esc(x.name)}</button>`; }).join('');
  const head = `<section class="hero" style="grid-template-columns:1fr"><div><div class="eyebrow">チーム比較</div><h1>分析結果の比較</h1>
      <div class="meta">保存した分析（と現在のデータ）から2〜${CMP_MAX}件を選んでください。値は1試合あたりの平均です。対戦相手の水準が違う場合は単純比較に注意が必要です。</div></div></section>
    <section class="card"><div class="card-head"><h2>比較する分析</h2><p>${sel.length}件を選択中</p></div>
      ${opts.length ? `<div class="team-chips">${chips}</div>` : '<p class="muted" style="margin:0">比較できる分析がありません。「過去分析」タブで分析を保存してください。</p>'}</section>`;
  if (sel.length < 2) { app.innerHTML = head + (opts.length ? '<section class="card"><p class="muted" style="margin:0">2件以上選ぶと比較を表示します。</p></section>' : ''); bindCmpChips(); return; }
  // 各分析のデータを集計
  const ents = sel.map((x, i) => {
    const d = x.id === 'current' ? S.data : parseSheet(filterAoa(JSON.parse(x.aoa), new Set(x.excluded || [])));
    const vals = CMP_METRICS.map(([name, fn]) => mean(d.matches.map(m => fn(m.own, m.opp))));
    return { ...x, d, rec: recordOf(d), vals, color: `--c${i + 1}`, analysis: x.id === 'current' ? analysisDigest() : x.analysis };
  });
  const rows = CMP_METRICS.map(([name, , pol], k) => ({ name, pol, vals: ents.map(e => e.vals.at(k)) })).filter(r => r.vals.filter(v => v != null).length >= 2);
  // 最良の値（同値はすべて、全件同値なら判定なし）
  const bestSet = r => {
    if (!r.pol) return new Set();
    const v = r.vals.map(x => (x == null ? null : Math.round(x * r.pol * 1e6) / 1e6)), ok = v.filter(x => x != null), m = Math.max(...ok);
    return ok.every(x => x === m) ? new Set() : new Set(v.map((x, i) => (x === m ? i : -1)).filter(i => i >= 0));
  };
  // 同じチームの分析が複数あるときは分析名で区別する
  const short = (t, n = 14) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  const tag = e => '①②③④⑤⑥'.at(ents.indexOf(e));
  const lab = e => (ents.filter(x => x.d.ownTeam === e.d.ownTeam).length > 1 ? `${tag(e)} ${short(e.d.ownTeam, 11)}` : short(e.d.ownTeam));
  app.innerHTML = head + `
  <section class="card"><div class="card-head"><h2>成績</h2></div><div class="tbl-wrap"><table><thead><tr><th class="l">分析</th><th class="l">チーム</th><th>試合</th><th>勝-分-敗</th><th>勝点/試合</th><th>得点</th><th>失点</th><th class="l">期間</th></tr></thead><tbody>
    ${ents.map(e => `<tr><td class="l"><i class="sw" style="background:var(${e.color})"></i>${tag(e)} ${esc(e.name)}</td><td class="l">${esc(e.d.ownTeam)}</td><td>${e.rec.n}</td><td>${e.rec.W}-${e.rec.D}-${e.rec.L}</td><td>${((e.rec.W * 3 + e.rec.D) / e.rec.n).toFixed(2)}</td><td>${e.rec.GF}</td><td>${e.rec.GA}</td><td class="l">${esc(e.rec.from)}〜${esc(e.rec.to)}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section><div class="card-head" style="margin-bottom:10px"><h2>指標ごとの比較（1試合平均）</h2><p>${ents.map(e => `<span class="lg"><i class="sw" style="background:var(${e.color})"></i>${tag(e)} ${esc(e.name)}</span>`).join('')}</p></div>
    <div class="grid-3">${rows.map((r, k) => `<div class="card"><div class="mini-title"><h3>${esc(r.name)}</h3><span>${polLabel(r.pol)}</span></div><div class="chart-box" style="height:${44 + ents.length * 30}px"><canvas id="cmp-${k}" role="img" aria-label="${esc(r.name)}の比較"></canvas></div></div>`).join('')}</div></section>
  <section class="card"><div class="card-head"><h2>比較表</h2><p>▲＝最も良い値（スタイル指標は判定なし）</p></div><div class="tbl-wrap"><table><thead><tr><th class="l">指標</th>${ents.map(e => `<th><i class="sw" style="background:var(${e.color})"></i>${esc(lab(e))}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => { const b = bestSet(r); return `<tr><td class="l">${esc(r.name)} <span class="muted small">${polLabel(r.pol)}</span></td>${r.vals.map((v, i) => `<td${b.has(i) ? ' class="best"' : ''}>${cmpFmt(v, r.name)}${b.has(i) ? ' ▲' : ''}</td>`).join('')}</tr>`; }).join('')}
  </tbody></table></div></section>
  <section class="card"><div class="card-head"><h2>要因分析の比較</h2><p>保存時に計算した要点</p></div><div class="tbl-wrap"><table class="kv-wide"><thead><tr><th class="l">項目</th>${ents.map(e => `<th class="l"><i class="sw" style="background:var(${e.color})"></i>${esc(lab(e))}</th>`).join('')}</tr></thead><tbody>
    ${[['分析した行数', a => `${a.n}行`], ['得点をxGで説明できる割合', a => (a.r2 == null ? '–' : `${Math.round(a.r2 * 100)}%`)],
      ['偶然と区別できたモデル', a => (a.sig.length ? a.sig.map(s => `${esc(s.target)}${s.adj ? '（補正）' : ''} ~ ${esc(s.model)}（p = ${s.p.toFixed(3)}）`).join('<br>') : `なし（${a.conds}条件中）`)],
      ['チーム力補正後もxGと関係が残る指標', a => (a.hasStrength ? (a.keep.length ? a.keep.map(esc).join('、') : 'なし') : 'チーム力未設定')],
      ['チーム力とほぼ同じ動きをする指標', a => (a.hasStrength ? (a.conf.length ? a.conf.map(esc).join('、') : 'なし') : 'チーム力未設定')],
      ['チーム力の上位グループ', a => (a.strong.length ? a.strong.map(esc).join('、') : 'なし')]]
      .map(([lbl, f]) => `<tr><td class="l">${lbl}</td>${ents.map(e => `<td class="l small">${e.analysis ? f(e.analysis) : '–'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></section>`;
  bindCmpChips();
  rows.forEach((r, k) => {
    const b = bestSet(r);
    mk(document.getElementById(`cmp-${k}`), { type: 'bar', data: { labels: ents.map(lab), datasets: [{ label: r.name, data: r.vals, backgroundColor: ents.map(e => T(e.color.slice(2))), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 18 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: c => ents.at(c[0].dataIndex).name, label: c => ` ${cmpFmt(c.raw, r.name)}${b.has(c.dataIndex) ? '（最良）' : ''}` } } },
        scales: { x: { beginAtZero: true, grid: { color: T('grid') }, border: { display: false }, ticks: { maxTicksLimit: 5 } }, y: { grid: { display: false }, ticks: { font: { size: 11 } } } } } });
  });
}
function bindCmpChips() {
  app.querySelectorAll('.tchip.cmp').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    if (S.cmpSel.has(id)) S.cmpSel.delete(id); else if (S.cmpSel.size < CMP_MAX) S.cmpSel.add(id);
    renderCompare();
  }));
}

/* ============ Router ============ */
let toastTimer;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200); }
function updateBrand() { document.getElementById('brand-team').textContent = S.data ? S.data.ownTeam : ''; }
function route() {
  destroyCharts(); applyChartTheme();
  const h = location.hash.replace('#', '');
  let page = 'overview', no = 1;
  const mm = h.match(/^match-(\d+)$/);
  if (mm) { page = 'match'; no = Math.min(Math.max(1, +mm[1]), S.data ? S.data.matches.length : 1); }
  else if (['trends', 'import', 'analysis', 'history', 'compare'].includes(h)) page = h;
  if (!S.data && !['history', 'compare'].includes(page)) page = 'import';
  document.querySelector('.tabs').hidden = false;
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.route === page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (page === 'match') document.querySelector('.tabs a[data-route="match"]').setAttribute('href', '#match-' + no);
  ({ overview: renderOverview, match: () => renderMatch(no), trends: renderTrends, analysis: renderAnalysis, history: () => renderHistory(), compare: renderCompare, import: () => renderImport() })[page]();
}
function rerenderForTheme() { rerenderSafe(); }

/* ============ Boot: sample mode (artifact) or cloud mode (Firebase) ============ */
const CLOUD = typeof window.firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
let cloudUser = null;
const dataDoc = () => firebase.firestore().doc(`users/${cloudUser.uid}/datasets/current`);
async function saveCloud(aoa, fileName, files, excluded) {
  const json = JSON.stringify(aoa);
  if (json.length > 900000) throw new Error('ファイルが大きすぎて保存できません（上限 約900KB）。不要なシートや行を削除してください。');
  try {
    await dataDoc().set({ aoa: json, fileName, files: files || [fileName], excluded: excluded || [], uploadedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (e) {
    throw new Error(e.code === 'permission-denied' ? 'このアカウントには保存する権限がありません。' : `クラウドに保存できませんでした（${e.code || e.message}）。`);
  }
}
function renderGate(state, err) {
  destroyCharts();
  document.querySelector('.tabs').hidden = true;
  const who = cloudUser ? esc(cloudUser.email || '') : '';
  const body = {
    loading: '<p class="muted">確認しています…</p>',
    signin: `<p>このダッシュボードは、許可されたアカウントだけが利用できます。</p><button type="button" class="btn" id="signin">Google でログイン</button>${err ? `<div class="msg err" style="margin-top:14px">ログインできませんでした（${esc(err.code || err.message)}）。もう一度お試しください。</div>` : ''}`,
    denied: `<div class="msg err">${who} にはアクセス権がありません。許可されたアカウントでログインし直してください。</div><button type="button" class="btn ghost" id="switch" style="margin-top:14px">別のアカウントでログイン</button>`,
    error: `<div class="msg err">データを読み込めませんでした（${esc(err ? err.code || err.message : '')}）。通信状態を確認して、再読み込みしてください。</div>`,
  }[state];
  app.innerHTML = `<section class="card gate"><div class="eyebrow">Match Lens</div><h1 style="font-family:var(--font-display);font-size:34px;margin:4px 0 12px">ログイン</h1>${body}</section>`;
  const si = document.getElementById('signin'); if (si) si.addEventListener('click', signIn);
  const sw = document.getElementById('switch'); if (sw) sw.addEventListener('click', async () => { await firebase.auth().signOut(); signIn(); });
}
async function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await firebase.auth().signInWithPopup(provider); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-environment', 'auth/cancelled-popup-request'].includes(e.code)) return firebase.auth().signInWithRedirect(provider);
    if (e.code !== 'auth/popup-closed-by-user') renderGate('signin', e);
  }
}
function startUI() {
  window.addEventListener('hashchange', () => { if (!CLOUD || cloudUser) { route(); window.scrollTo({ top: 0 }); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderForTheme);
  new MutationObserver(rerenderForTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function rerenderSafe() { if (!CLOUD || (cloudUser && S.access)) route(); }
if (!CLOUD) {
  try { setDataset(SAMPLE_AOA, { source: 'sample', files: ['同梱サンプル'] }); } catch (e) { app.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  if (S.data) { updateBrand(); startUI(); route(); if (document.fonts) document.fonts.ready.then(route); }
} else {
  startUI();
  renderGate('loading');
  document.getElementById('signout').addEventListener('click', () => firebase.auth().signOut());
  firebase.auth().onAuthStateChanged(async user => {
    cloudUser = user; S.access = false; S.data = null; S.fullAoa = null; S.allMatches = null; S.excluded = new Set(); S.ana = null; S.viewing = null; S.prev = null; S.histCache = null; S.cmpSel = new Set(); updateBrand(); updateBanner();
    const acct = document.getElementById('account');
    acct.hidden = !user; document.getElementById('acct-email').textContent = user ? user.email || '' : '';
    if (!user) return renderGate('signin');
    try {
      const snap = await dataDoc().get();
      S.access = true;
      if (snap.exists) { const v = snap.data(); setDataset(JSON.parse(v.aoa), { source: 'cloud', fileName: v.fileName, files: v.files || [v.fileName], excluded: v.excluded || [] }); updateBrand(); }
      route();
      if (document.fonts) document.fonts.ready.then(rerenderSafe);
    } catch (e) {
      renderGate(e.code === 'permission-denied' ? 'denied' : 'error', e);
    }
  });
}
</script>
