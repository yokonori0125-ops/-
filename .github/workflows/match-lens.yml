name: Match Lens — test and deploy

on:
  push:
    branches: [main]
    paths: ['soccer-dashboard/**', '.github/workflows/match-lens.yml']
  pull_request:
    paths: ['soccer-dashboard/**', '.github/workflows/match-lens.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-lens-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: soccer-dashboard

jobs:
  test:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soccer-dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soccer-dashboard/package-lock.json
      - run: npm ci
      - name: Build (no data in the bundle)
        run: python3 build.py --firebase
      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::シークレット FIREBASE_SERVICE_ACCOUNT と FIREBASE_PROJECT_ID を設定してください（soccer-dashboard/README.md）"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
